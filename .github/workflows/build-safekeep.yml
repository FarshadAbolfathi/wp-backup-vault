name: Build SafeKeep.exe

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build SafeKeep.exe with PyInstaller
        run: >
          pyinstaller
          --onefile
          --windowed
          --name SafeKeep
          --add-data "safekeep;safekeep"
          main.py

      - name: Upload SafeKeep.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeKeep-Windows
          path: windows-client/dist/SafeKeep.exe
          retention-days: 30
